plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group = 'io.freelance.kjm'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

def droolsVersion = '7.74.1.Final'

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Drools Rule Engine (Matches user local reference)
    implementation "org.drools:drools-engine:${droolsVersion}"
    implementation "org.drools:drools-mvel:${droolsVersion}"

    // Jackson JSON Serializer
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Mathematical Expression Evaluator for Calculator Tool
    implementation 'net.objecthunter:exp4j:0.4.8'

    // Google Cloud Secret Manager (1:1 PyRete Parity)
    implementation platform('com.google.cloud:libraries-bom:26.37.0')
    implementation 'com.google.cloud:google-cloud-secretmanager'

    // Logging
    implementation 'org.slf4j:slf4j-api'

    // Testing
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

ext['junit-jupiter.version'] = '5.10.2'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
