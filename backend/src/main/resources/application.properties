spring.application.name=react-drools-coordinator
server.port=8080

# Logging Configuration
logging.level.root=INFO
logging.level.io.freelance.kjm.react=DEBUG
logging.level.org.drools=INFO

# Allow optional bean definition overriding if needed
spring.main.allow-bean-definition-overriding=true

# Gemini LLM Remote Configuration
gemini.api-key=${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
